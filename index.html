<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Word Deck | マイ単語帳</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">MY VOCABULARY</p>
      <h1>Word Deck</h1>
    </div>
    <button id="addHeaderButton" class="primary compact" type="button">＋ 単語を追加</button>
  </header>

  <main>
    <section id="homeView" class="view active" aria-labelledby="homeTitle">
      <div class="hero-card">
        <div>
          <p class="eyebrow">今日の復習</p>
          <h2 id="homeTitle">覚える単語を、迷わず開く。</h2>
          <p class="muted">登録した単語はこの端末のブラウザ内に保存されます。</p>
        </div>
        <button id="startStudyButton" class="primary large" type="button">カード学習を始める</button>
      </div>

      <div class="stats" aria-label="学習状況">
        <article><span id="totalCount">0</span><small>登録済み</small></article>
        <article><span id="newCount">0</span><small>未学習</small></article>
        <article><span id="learningCount">0</span><small>学習中</small></article>
        <article><span id="masteredCount">0</span><small>覚えた</small></article>
      </div>

      <section class="panel quick-actions">
        <button id="addHomeButton" class="action-card" type="button"><strong>単語を追加</strong><span>単語と意味を入力して保存</span></button>
        <button id="listHomeButton" class="action-card" type="button"><strong>単語一覧</strong><span>検索・編集・削除</span></button>
      </section>
    </section>

    <section id="listView" class="view" aria-labelledby="listTitle">
      <div class="section-heading">
        <div><p class="eyebrow">LIBRARY</p><h2 id="listTitle">単語一覧</h2></div>
        <button id="addListButton" class="primary compact" type="button">＋ 追加</button>
      </div>
      <div class="filters panel">
        <label>検索<input id="searchInput" type="search" placeholder="単語・意味・補足で検索"></label>
        <label>カテゴリー<select id="categoryFilter"><option value="all">すべて</option></select></label>
        <label>習得状態<select id="statusFilter"><option value="all">すべて</option><option value="new">未学習</option><option value="learning">学習中</option><option value="mastered">覚えた</option></select></label>
      </div>
      <div id="wordList" class="word-list"></div>
      <div id="emptyList" class="empty-state hidden"><strong>該当する単語がありません</strong><span>条件を変えるか、新しい単語を追加してください。</span></div>
    </section>

    <section id="studyView" class="view" aria-labelledby="studyTitle">
      <div class="section-heading">
        <div><p class="eyebrow">FLASH CARDS</p><h2 id="studyTitle">カード学習</h2></div>
        <span id="studyProgress" class="progress-pill">0 / 0</span>
      </div>
      <div class="study-controls panel">
        <label>対象<select id="studyStatusFilter"><option value="not-mastered">未習得のみ</option><option value="all">すべて</option><option value="new">未学習</option><option value="learning">学習中</option><option value="mastered">覚えた</option></select></label>
        <label>カテゴリー<select id="studyCategoryFilter"><option value="all">すべて</option></select></label>
        <label class="switch-row"><input id="shuffleToggle" type="checkbox">ランダム順</label>
      </div>
      <div id="studyEmpty" class="empty-state hidden"><strong>学習対象の単語がありません</strong><span>条件を変えるか、単語を追加してください。</span></div>
      <div id="studyArea">
        <button id="flashcard" class="flashcard" type="button" aria-live="polite">
          <span id="cardCategory" class="card-category"></span>
          <span id="cardPrompt" class="card-prompt"></span>
          <span id="cardAnswer" class="card-answer hidden"></span>
          <span id="cardNote" class="card-note hidden"></span>
          <span id="revealHint" class="reveal-hint">タップして意味を見る</span>
        </button>
        <div class="study-actions">
          <button id="prevCard" class="secondary" type="button">← 前へ</button>
          <button id="markLearning" class="warning" type="button">まだ</button>
          <button id="markMastered" class="success" type="button">覚えた</button>
          <button id="nextCard" class="secondary" type="button">次へ →</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button data-view="homeView" class="nav-button active" type="button">ホーム</button>
    <button data-view="listView" class="nav-button" type="button">一覧</button>
    <button data-view="studyView" class="nav-button" type="button">学習</button>
  </nav>

  <dialog id="wordDialog">
    <form id="wordForm" method="dialog">
      <div class="dialog-heading"><h2 id="dialogTitle">単語を追加</h2><button id="closeDialog" class="icon-button" type="button" aria-label="閉じる">×</button></div>
      <input id="wordId" type="hidden">
      <label>単語・用語 <span class="required">必須</span><input id="wordInput" maxlength="100" required autocomplete="off"></label>
      <label>意味 <span class="required">必須</span><textarea id="meaningInput" maxlength="500" required rows="3"></textarea></label>
      <label>補足・例文<textarea id="noteInput" maxlength="800" rows="3"></textarea></label>
      <label>カテゴリー<input id="categoryInput" list="categoryOptions" maxlength="40" placeholder="例：英単語"></label>
      <datalist id="categoryOptions"></datalist>
      <label>習得状態<select id="formStatus"><option value="new">未学習</option><option value="learning">学習中</option><option value="mastered">覚えた</option></select></label>
      <p id="formError" class="error hidden"></p>
      <div class="dialog-actions"><button id="cancelDialog" class="secondary" type="button">キャンセル</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="deleteDialog" class="confirm-dialog">
    <div><h2>単語を削除しますか？</h2><p id="deleteMessage" class="muted"></p><div class="dialog-actions"><button id="cancelDelete" class="secondary" type="button">キャンセル</button><button id="confirmDelete" class="danger" type="button">削除する</button></div></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
